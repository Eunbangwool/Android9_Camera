name: Release CCTV APK (versioned)

# v* 태그를 푸시하면 APK 를 빌드해 버전 릴리스(정식, latest)로 발행한다.
# (롤링 디버그는 build-cctv-apk.yml 가 매 push 마다 별도로 갱신)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # Releases 발행에 필요

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: assembleDebug → 버전 릴리스
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행권한
        run: chmod +x gradlew

      - name: 빌드 (assembleDebug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: APK 버전명으로 정리
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/local/debug/*.apk "dist/farmmachine-cctv-local-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/cast/debug/*.apk  "dist/farmmachine-cctv-cast-${GITHUB_REF_NAME}.apk"
          ls -l dist

      - name: 버전 릴리스 발행
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CCTV ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body: |
            팜머신 CCTV 뷰어 — **${{ github.ref_name }}** (디버그 서명, 태블릿 사이드로드용)

            Apollo 10 Pro 아날로그 카메라(qcarcam/AIS) 2채널 뷰어.

            - **local** (`...-local-...apk`, com.farmmachine.cctv) = 태블릿 화면 전용 뷰어
            - **cast** (`...-cast-...apk`, com.farmmachine.cctv.cast) = 화면 + 폰 시청용 MJPEG 서버
              (폰 브라우저에서 `http://<태블릿 Wi-Fi IP>:8080`)

            **기능**: 2채널 분할 + 탭 전체화면, 720p 비율 유지, 카메라 전원 자동 인가, 부팅 자동 실행.

            **설치**: 태블릿에서 APK 다운로드 → "출처를 알 수 없는 앱" 허용 후 설치.
            ⚠ 디버그 키 서명(스토어 배포용 아님). local/cast 는 패키지가 달라 동시 설치 가능.

            - commit: `${{ github.sha }}`
          files: dist/*.apk
